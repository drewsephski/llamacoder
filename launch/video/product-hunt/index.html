    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-meet-squid", { x: -1920, duration: 0.4, ease: "power3.inOut" }, 12);
        tl.fromTo("#el-03-plan-mode", { x: 1920, opacity: 1 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, 12);
        tl.to("#el-03-plan-mode", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.fromTo("#el-04-build-iterate", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26);
        tl.to("#el-05-verify-repair", { x: -1920, duration: 0.4, ease: "power3.inOut" }, 54);
        tl.fromTo("#el-06-own-the-code", { x: 1920, opacity: 1 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, 54);
        tl.to("#el-06-own-the-code", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 66);
        tl.fromTo("#el-07-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 66);
        tl.to({}, { duration: 72 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
