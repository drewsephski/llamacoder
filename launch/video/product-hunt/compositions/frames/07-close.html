    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      (() => {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["07-close"] = tl;

        const videos = [
          document.getElementById("f07-close-video-fieldflow"),
          document.getElementById("f07-close-video-launchops"),
          document.getElementById("f07-close-video-cinder"),
        ];
        const shells = [
          document.getElementById("f07-close-shell-fieldflow"),
          document.getElementById("f07-close-shell-launchops"),
          document.getElementById("f07-close-shell-cinder"),
        ];
        const labels = [
          document.getElementById("f07-close-label-fieldflow"),
          document.getElementById("f07-close-label-launchops"),
          document.getElementById("f07-close-label-cinder"),
        ];
        const arrivalTimes = [0.08, 0.80, 1.52];

        videos.forEach((video, index) => {
          tl.set(video, { borderRadius: 14, opacity: 0, y: -150, scale: 1.08, transformOrigin: "50% 50%" }, 0);
          tl.fromTo(
            video,
            { opacity: 0, y: -150, scale: 0.94 },
            { opacity: 1, y: -150, scale: 1.08, duration: 0.48, ease: "power3.out" },
            arrivalTimes[index],
          );
          tl.fromTo(
            shells[index],
            { opacity: 0, y: -150, scale: 0.94 },
            { opacity: 1, y: -150, scale: 1.08, duration: 0.48, ease: "power3.out" },
            arrivalTimes[index],
          );
          tl.fromTo(
            labels[index],
            { opacity: 0, y: -138 },
            { opacity: 0, y: -150, duration: 0.34, ease: "power2.out" },
            arrivalTimes[index] + 0.28,
          );
          tl.to(video, { y: 0, scale: 1, duration: 0.56, ease: "power3.inOut" }, 2.72);
          tl.to(shells[index], { y: 0, scale: 1, duration: 0.56, ease: "power3.inOut" }, 2.72);
          tl.to(labels[index], { y: 0, opacity: 1, duration: 0.56, ease: "power3.inOut" }, 2.72);
        });

        tl.fromTo(
          '[class~="f07-close-mark-ring"]',
          { opacity: 0, scale: 0.35 },
          { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" },
          2.76,
        );
        tl.fromTo(
          '[id="f07-close-logo"]',
          { opacity: 0, scale: 0.72, rotation: -8, clipPath: "inset(0 50% 0 50%)" },
          { opacity: 1, scale: 1, rotation: 0, clipPath: "inset(0 0% 0 0%)", duration: 0.68, ease: "power3.out" },
          2.80,
        );

        const WORDS = ["Plan.", "Build.", "Verify.", "Export."];
        const BASE_DURATION = 0.18;
        const SEC_PER_CHAR = 0.012;
        let cumulative = 0;
        const WORD_TIMELINE = WORDS.map((word) => {
          const duration = BASE_DURATION + word.length * SEC_PER_CHAR;
          const start = cumulative;
          cumulative += duration;
          return { word, start, end: cumulative };
        });
        const wordEls = Array.from(document.querySelectorAll('[id="f07-close-launch-line"] span'));
        const wordDriver = { t: 0 };
        let lastWordIndex = -1;

        tl.set(wordEls, { opacity: 0, color: "#666666", y: 8 }, 0);
        tl.to(
          wordDriver,
          {
            t: cumulative,
            duration: cumulative,
            ease: "none",
            onUpdate: () => {
              let activeIndex = 0;
              for (let index = WORD_TIMELINE.length - 1; index >= 0; index -= 1) {
                if (wordDriver.t >= WORD_TIMELINE[index].start) {
                  activeIndex = index;
                  break;
                }
              }
              if (activeIndex !== lastWordIndex) {
                wordEls.forEach((element, index) => {
                  const revealed = index <= activeIndex;
                  element.style.opacity = revealed ? "1" : "0";
                  element.style.color = revealed ? "#0a0a0a" : "#666666";
                  element.style.transform = revealed ? "translateY(0px)" : "translateY(8px)";
                });
                lastWordIndex = activeIndex;
              }
            },
          },
          3.08,
        );

        tl.fromTo(
          '[id="f07-close-url-mask"]',
          { clipPath: "inset(0 100% 0 0)", opacity: 1 },
          { clipPath: "inset(0 0% 0 0)", opacity: 1, duration: 0.52, ease: "power3.inOut" },
          4.40,
        );
        tl.fromTo(
          '[id="f07-close-url-edge"]',
          { x: 0, opacity: 1 },
          { x: 632, opacity: 0, duration: 0.52, ease: "power3.inOut" },
          4.40,
        );
      })();
