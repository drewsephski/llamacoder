  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const world = document.getElementById("f03-world");
      const camera = { scale: 1, x: 0, y: 0 };

      const applyCamera = () => {
        world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
      };

      applyCamera();

      tl.fromTo(
        "#f03-prompt-shell",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        "#f03-kicker",
        { x: -28, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.12,
      );
      tl.fromTo(
        "#f03-prompt-focus",
        { scaleX: 0, opacity: 0.2 },
        { scaleX: 1, opacity: 1, duration: 0.66, ease: "power3.out" },
        1.05,
      );
      tl.fromTo(
        "#f03-marker-one",
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.66,
      );

      tl.to(
        camera,
        { x: -514, duration: 0.92, ease: "power3.inOut", onUpdate: applyCamera },
        3.8,
      );
      tl.fromTo(
        "#f03-question-one, .f03-station-one .f03-depth, .f03-station-one .f03-station-dot",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.25,
      );

      tl.to(
        camera,
        { x: -1464, duration: 1.0, ease: "power3.inOut", onUpdate: applyCamera },
        5.12,
      );
      tl.fromTo(
        "#f03-station-two",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        5.7,
      );

      tl.to(
        camera,
        { x: -2414, duration: 1.0, ease: "power3.inOut", onUpdate: applyCamera },
        6.62,
      );
      tl.fromTo(
        "#f03-station-three",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
        7.2,
      );
      tl.fromTo(
        "#f03-rail-fill",
        { scaleX: 0.1 },
        { scaleX: 1, duration: 4.1, ease: "none" },
        3.8,
      );

      tl.to(
        camera,
        { x: -3300, duration: 0.62, ease: "power4.inOut", onUpdate: applyCamera },
        8.4,
      );
      tl.fromTo(
        "#f03-plan-shell",
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.62, ease: "power4.out" },
        8.4,
      );

      const planEntries = [
        { title: "01", body: "structure", hold: 0.22 },
        { title: "02", body: "sequence", hold: 0.22 },
        { title: "03", body: "verification", hold: 0.46 },
      ];
      let cumulative = 0;
      const planTimeline = planEntries.map((entry) => {
        const duration = 0.42 + entry.body.length * 0.025 + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const planDriver = { t: 0 };
      const planSteps = [
        document.getElementById("f03-plan-step-1"),
        document.getElementById("f03-plan-step-2"),
        document.getElementById("f03-plan-step-3"),
      ];
      let lastPlanIndex = -1;

      const entryIndexAt = (time) => {
        for (let index = planTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= planTimeline[index].start) return index;
        }
        return 0;
      };

      tl.to(
        planDriver,
        {
          t: cumulative,
          duration: cumulative,
          ease: "none",
          onUpdate: () => {
            const activeIndex = entryIndexAt(planDriver.t);
            if (activeIndex === lastPlanIndex) return;

            planSteps.forEach((step, index) => {
              const isVisible = index <= activeIndex;
              const isActive = index === activeIndex;
              step.style.opacity = isVisible ? (isActive ? "1" : "0.58") : "0";
              step.style.transform = isVisible ? "translateY(0px)" : "translateY(18px)";
            });
            lastPlanIndex = activeIndex;
          },
        },
        9.02,
      );

      tl.fromTo(
        "#f03-approval",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        11.8,
      );
      tl.fromTo(
        "#f03-check",
        { scale: 0.35, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        12.06,
      );

      window.__timelines["03-plan-mode"] = tl;
    })();
  </script>
