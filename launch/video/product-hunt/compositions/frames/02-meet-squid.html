  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-meet-squid"]');
      const brand = root.querySelector("#frame-02-meet-squid-brand");
      const mark = root.querySelector("#frame-02-meet-squid-mark");
      const accent = root.querySelector("#frame-02-meet-squid-accent");
      const videoFrame = root.querySelector("#frame-02-meet-squid-video-frame");
      const callout = root.querySelector("#frame-02-meet-squid-callout");
      const calloutName = root.querySelector("#frame-02-meet-squid-input-name");
      const calloutCount = root.querySelector("#frame-02-meet-squid-count");
      const connectorGroup = root.querySelector("#frame-02-meet-squid-connectors");
      const connectorLine = root.querySelector("#frame-02-meet-squid-connector-line");
      const target = root.querySelector("#frame-02-meet-squid-target");
      const sequenceDots = Array.from(root.querySelectorAll(".frame-02-meet-squid-sequence-dot"));
      const workflow = root.querySelector("#frame-02-meet-squid-workflow");
      const railFill = root.querySelector("#frame-02-meet-squid-rail-fill");
      const workflowSteps = Array.from(root.querySelectorAll(".frame-02-meet-squid-step"));

      const CONTENT = [
        { title: "Idea", hold: 0.20, x: 1190, y: 536, path: "M 476 420 C 700 420, 880 536, 1190 536" },
        { title: "Screenshot", hold: 0.08, x: 1146, y: 569, path: "M 476 420 C 710 420, 870 569, 1146 569" },
        { title: "Website URL", hold: 0.06, x: 1190, y: 840, path: "M 476 420 C 760 420, 840 840, 1190 840" },
        { title: "API", hold: 0.32, x: 1246, y: 639, path: "M 476 420 C 720 420, 940 639, 1246 639" },
      ];
      const BASE_DURATION = 0.52;
      const SEC_PER_CHAR = 0.02;
      let cumulative = 0;
      const TIMELINE = CONTENT.map((entry, index) => {
        const duration = BASE_DURATION + entry.title.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, index, start, end: cumulative };
      });

      const entryAt = (time) => {
        for (let index = TIMELINE.length - 1; index >= 0; index -= 1) {
          if (time >= TIMELINE[index].start) return TIMELINE[index];
        }
        return TIMELINE[0];
      };

      let lastTitle = "";
      const renderEntry = (entry) => {
        if (entry.title === lastTitle) return;
        calloutName.textContent = entry.title;
        calloutCount.textContent = `${String(entry.index + 1).padStart(2, "0")} / 04`;
        target.style.left = `${entry.x}px`;
        target.style.top = `${entry.y}px`;
        connectorLine.setAttribute("d", entry.path);
        sequenceDots.forEach((dot, index) => {
          dot.dataset.active = index <= entry.index ? "true" : "false";
        });
        lastTitle = entry.title;
      };

      renderEntry(TIMELINE[0]);

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-meet-squid"] = tl;

      tl.fromTo(
        videoFrame,
        { y: 34, opacity: 0, filter: "blur(18px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.72, ease: "power4.out" },
        0,
      );
      tl.fromTo(
        brand,
        { x: -46, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        0.04,
      );
      tl.fromTo(
        mark,
        { scale: 0.72, rotation: -7, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.64, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        accent,
        { scaleX: 0, opacity: 0, transformOrigin: "left center" },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.42,
      );

      tl.fromTo(
        callout,
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power4.out" },
        1.5,
      );
      tl.fromTo(
        connectorGroup,
        { opacity: 0 },
        { opacity: 1, duration: 0.28, ease: "power2.out" },
        1.58,
      );
      tl.fromTo(
        target,
        { scale: 0.65, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
        1.56,
      );

      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: cumulative,
          duration: cumulative,
          ease: "none",
          onUpdate: () => renderEntry(entryAt(driver.t)),
        },
        1.5,
      );

      TIMELINE.slice(1).forEach((entry) => {
        const beat = 1.5 + entry.start;
        tl.fromTo(
          callout,
          { x: -18, opacity: 0.3 },
          { x: 0, opacity: 1, duration: 0.26, ease: "power3.out", immediateRender: false },
          beat,
        );
        tl.fromTo(
          target,
          { scale: 0.68, opacity: 0.25 },
          { scale: 1, opacity: 1, duration: 0.30, ease: "power3.out", immediateRender: false },
          beat,
        );
        tl.fromTo(
          connectorGroup,
          { opacity: 0.25 },
          { opacity: 1, duration: 0.22, ease: "power2.out", immediateRender: false },
          beat,
        );
      });

      tl.to(
        callout,
        { x: -230, duration: 0.30, ease: "power4.in" },
        4.52,
      );
      tl.to(
        callout,
        { opacity: 0, duration: 0.20, ease: "power1.in" },
        4.60,
      );
      tl.to(
        [connectorGroup, target],
        { opacity: 0, duration: 0.18, ease: "power1.in" },
        4.62,
      );

      tl.fromTo(
        workflow,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        4.80,
      );
      tl.fromTo(
        railFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 1.22, ease: "power2.out" },
        4.96,
      );
      workflowSteps.forEach((step, index) => {
        tl.fromTo(
          step,
          { y: 22, scale: 0.72, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
          4.92 + index * 0.27,
        );
      });
    })();
  </script>
